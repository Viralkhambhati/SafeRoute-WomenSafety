services:
  - type: web
    name: saferoute-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PGHOST
        sync: false
      - key: PGPORT
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VAPID_PUBLIC_KEY
        value: BG0ZTUG5uAF_NKsqfDhLeXN4ntqw2d_XsDiq8-_MovlL-uCqdRxMpIp6Dan3SVutr9lUO9u9FitINJqTNy4SZSs
      - key: VAPID_PRIVATE_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
